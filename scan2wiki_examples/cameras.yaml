# measured per camera model magnify constants
# see https://github.com/WolfgangFahl/scan2wiki/issues/41
# zoom_position_size: coordinate space of eoszoomposition
# zoom_window_size: native pixel size of the camera's zoom window
# zoom_offset: measured center offset - command = desired center - offset
# native_zoom_level: the level the camera magnifies natively; higher
#   levels are served as digital enlargement as in EOS Utility
cameras:
  Canon EOS 1000D:
    model: Canon EOS 1000D
    zoom_position_size: [3888, 2592]
    zoom_window_size: [768, 792]
    zoom_offset: [410, 143]
    native_zoom_level: 5
