# measured per camera model magnify constants
# see https://github.com/WolfgangFahl/scan2wiki/issues/41
#
# all values measured on the live camera against a 30cm ruler scene
# by template matching zoom frames onto the full view (2026-08-23):
# - native_zoom_level: the level the camera magnifies natively;
#   higher levels are digital enlargement as in EOS Utility
# - zoom_raster: pixel size of the served zoom frame
# - window_fraction: native window size as fractions of the full view
# - x_axis/y_axis: eoszoomposition response [scale, offset, cmd_max]
#   command = scale * window_top_left_fraction + offset
#   honored only in [offset, cmd_max] - beyond cmd_max the window
#   stops, on the y axis already at top fraction 0.57 so the bottom
#   of the view is not reachable by the camera
cameras:
  Canon EOS 1000D:
    model: Canon EOS 1000D
    native_zoom_level: 5
    zoom_raster: [768, 792]
    window_fraction: [0.200, 0.309]
    x_axis: [3717, 80, 3052]
    y_axis: [2548, 213, 1656]
